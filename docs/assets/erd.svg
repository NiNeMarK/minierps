<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <style>
    .box { fill:#ffffff; stroke:#333333; stroke-width:1; }
    .title { font: bold 14px sans-serif; }
    .field { font: 12px monospace; }
    .rel { stroke:#666666; stroke-width:1.2; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" />
    </marker>
  </defs>

  <!-- companies -->
  <g transform="translate(40,40)">
    <rect class="box" width="260" height="70" rx="6" ry="6"></rect>
    <text x="12" y="22" class="title">companies</text>
    <text x="12" y="42" class="field">id (PK) : uuid</text>
    <text x="12" y="58" class="field">name, timezone, currency</text>
  </g>

  <!-- branches -->
  <g transform="translate(340,40)">
    <rect class="box" width="260" height="70" rx="6" ry="6"></rect>
    <text x="12" y="22" class="title">branches</text>
    <text x="12" y="42" class="field">id (PK) : uuid</text>
    <text x="12" y="58" class="field">company_id (FK) : uuid, name</text>
  </g>

  <!-- warehouses -->
  <g transform="translate(640,40)">
    <rect class="box" width="260" height="70" rx="6" ry="6"></rect>
    <text x="12" y="22" class="title">warehouses</text>
    <text x="12" y="42" class="field">id (PK) : uuid</text>
    <text x="12" y="58" class="field">branch_id (FK) : uuid, name</text>
  </g>

  <!-- products -->
  <g transform="translate(40,160)">
    <rect class="box" width="380" height="100" rx="6" ry="6"></rect>
    <text x="12" y="22" class="title">products</text>
    <text x="12" y="44" class="field">id (PK) : uuid | company_id (FK) : uuid</text>
    <text x="12" y="64" class="field">sku, name, unit, cost_price, sell_price</text>
    <text x="12" y="84" class="field">has_lot, has_expire_date</text>
  </g>

  <!-- stock_balance -->
  <g transform="translate(440,160)">
    <rect class="box" width="300" height="80" rx="6" ry="6"></rect>
    <text x="12" y="22" class="title">stock_balance</text>
    <text x="12" y="44" class="field">product_id (PK/FK), warehouse_id (PK/FK)</text>
    <text x="12" y="64" class="field">quantity</text>
  </g>

  <!-- sales_orders -->
  <g transform="translate(40,300)">
    <rect class="box" width="420" height="110" rx="6" ry="6"></rect>
    <text x="12" y="22" class="title">sales_orders</text>
    <text x="12" y="44" class="field">id (PK) : uuid | company_id, branch_id, customer_id</text>
    <text x="12" y="64" class="field">status, total_amount, tax_amount, created_by</text>
    <text x="12" y="84" class="field">created_at</text>
  </g>

  <!-- sales_order_lines -->
  <g transform="translate(500,300)">
    <rect class="box" width="420" height="110" rx="6" ry="6"></rect>
    <text x="12" y="22" class="title">sales_order_lines</text>
    <text x="12" y="44" class="field">id (PK) : uuid | sales_order_id (FK)</text>
    <text x="12" y="64" class="field">product_id (FK), qty, unit_price, line_total, warehouse_id</text>
    <text x="12" y="84" class="field">created_at</text>
  </g>

  <!-- stock_movements -->
  <g transform="translate(40,460)">
    <rect class="box" width="480" height="110" rx="6" ry="6"></rect>
    <text x="12" y="22" class="title">stock_movements</text>
    <text x="12" y="44" class="field">id (PK), company_id, product_id, warehouse_id</text>
    <text x="12" y="64" class="field">change_qty, reason, reference_type, reference_id</text>
    <text x="12" y="84" class="field">balance_after, created_at</text>
  </g>

  <!-- audit_logs -->
  <g transform="translate(560,460)">
    <rect class="box" width="360" height="90" rx="6" ry="6"></rect>
    <text x="12" y="22" class="title">audit_logs</text>
    <text x="12" y="44" class="field">id (PK), company_id, user_id, target_table, target_id</text>
    <text x="12" y="64" class="field">action, old_value, new_value, created_at</text>
  </g>

  <!-- relationships (arrows) -->
  <line x1="300" y1="70" x2="340" y2="70" class="rel" />
  <line x1="600" y1="70" x2="640" y2="70" class="rel" />

  <line x1="220" y1="160" x2="220" y2="260" class="rel" />
  <line x1="460" y1="200" x2="460" y2="280" class="rel" />

  <line x1="220" y1="300" x2="500" y2="300" class="rel" />
  <line x1="220" y1="380" x2="220" y2="460" class="rel" />

  <line x1="540" y1="380" x2="600" y2="460" class="rel" />

  <text x="40" y="600" class="field">Note: This is a simplified ERD. Generate full ERD from migrations for complete diagram.</text>
</svg>